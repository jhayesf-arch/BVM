[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "bvm"
version = "0.1.0"
description = "Parametric 3D MCA vessel model for ischemic disease studies"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
bvm = "bvm.cli:main"

[tool.setuptools]
packages = ["bvm"]
